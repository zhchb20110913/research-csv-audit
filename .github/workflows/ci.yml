name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run test suite
        run: node --test

      - name: Generate example reports
        run: |
          node bin/research-csv-audit.js samples/experiment.csv --output reports/audit.md
          node bin/research-csv-audit.js samples/experiment.csv --format json --output reports/audit.json
          test -s reports/audit.md
          test -s reports/audit.json

