<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title desc">
  <title id="title">Research CSV Audit workflow</title>
  <desc id="desc">An experiment CSV flows into a quality report with missing value and outlier findings.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1560" height="620" rx="36" fill="url(#background)"/>
  <circle cx="1380" cy="80" r="190" fill="#2563eb" opacity="0.12"/>
  <circle cx="120" cy="570" r="220" fill="#06b6d4" opacity="0.10"/>

  <text x="780" y="82" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Research CSV Audit</text>
  <text x="780" y="124" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">experiment data in · reproducible quality report out</text>

  <g filter="url(#shadow)">
    <rect x="100" y="180" width="520" height="330" rx="24" fill="#ffffff"/>
    <rect x="100" y="180" width="520" height="64" rx="24" fill="#e2e8f0"/>
    <rect x="100" y="220" width="520" height="24" fill="#e2e8f0"/>
    <circle cx="136" cy="212" r="8" fill="#f87171"/>
    <circle cx="164" cy="212" r="8" fill="#fbbf24"/>
    <circle cx="192" cy="212" r="8" fill="#4ade80"/>
    <text x="228" y="220" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19">experiment.csv</text>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#334155">
      <text x="132" y="286" font-weight="700">sample_id</text><text x="280" y="286" font-weight="700">reaction_time_s</text><text x="500" y="286" font-weight="700">yield</text>
      <line x1="128" y1="302" x2="590" y2="302" stroke="#cbd5e1"/>
      <text x="132" y="338">S01</text><text x="280" y="338">10.2</text><text x="500" y="338">81.4</text>
      <text x="132" y="382">S02</text><text x="280" y="382">10.5</text><text x="500" y="382">82.1</text>
      <text x="132" y="426">S04</text><text x="280" y="426" fill="#d97706">missing</text><text x="500" y="426">81.8</text>
      <text x="132" y="470">S05</text><text x="280" y="470">10.4</text><text x="500" y="470" fill="#dc2626" font-weight="700">120.0</text>
    </g>
  </g>

  <g>
    <path d="M665 330 H845" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <path d="M820 296 L860 330 L820 364" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="758" y="300" text-anchor="middle" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">node CLI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="180" width="560" height="330" rx="24" fill="#ffffff"/>
    <rect x="900" y="180" width="560" height="64" rx="24" fill="#dbeafe"/>
    <text x="936" y="221" fill="#1e3a8a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Audit report</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="940" y="292" fill="#64748b" font-size="18">DATA ROWS</text>
      <text x="940" y="338" fill="#0f172a" font-size="42" font-weight="700">10</text>
      <text x="1120" y="292" fill="#64748b" font-size="18">NUMERIC COLUMNS</text>
      <text x="1120" y="338" fill="#0f172a" font-size="42" font-weight="700">3</text>

      <rect x="940" y="378" width="212" height="82" rx="16" fill="#fff7ed" stroke="#fdba74"/>
      <text x="964" y="410" fill="#9a3412" font-size="17" font-weight="700">MISSING VALUES</text>
      <text x="964" y="445" fill="#c2410c" font-size="30" font-weight="700">1</text>

      <rect x="1184" y="378" width="232" height="82" rx="16" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="1208" y="410" fill="#991b1b" font-size="17" font-weight="700">IQR OUTLIERS</text>
      <text x="1208" y="445" fill="#b91c1c" font-size="30" font-weight="700">1</text>
    </g>
  </g>

  <text x="780" y="570" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20">CSV → parse → summarize → flag → Markdown / JSON</text>
</svg>

